<!DOCTYPE html>
<html lang="en" class="login-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURplan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><img src="logo-nurplan.png" alt="NURplan Logo" style="width:72px;height:72px;object-fit:contain;border-radius:12px;"></div>
        <h1 class="login-title">NURplan</h1>
        <p class="login-subtitle">Nursing Informatics Dashboard</p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Authentication tabs">
        <button class="auth-tab active" id="loginTab" type="button" data-target="loginPanel">Login</button>
        <button class="auth-tab" id="signupTab" type="button" data-target="signupPanel">Signup</button>
      </div>

      <div class="auth-panels">
        <!-- Login Panel -->
        <div class="auth-panel active" id="loginPanel" role="tabpanel" aria-labelledby="loginTab">
          <div class="login-error" id="loginError">Please enter both username and password.</div>

          <form class="login-form" id="loginForm">
            <div class="form-group">
              <label for="username">Username</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </span>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
              </div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </span>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
              </div>
            </div>
            <button type="submit" class="btn-login">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
              </svg>
              Sign In
            </button>
          </form>

          <div class="login-meta">
            <a href="#" class="forgot-password">Forgot Password?</a>
          </div>

          <div class="login-demo-hint">
            Demo: Enter any username and password to access the system.
          </div>
        </div>

        <!-- Signup Panel (Simulation Only) -->
        <div class="auth-panel" id="signupPanel" role="tabpanel" aria-labelledby="signupTab">
          <div class="auth-message" id="signupMessage"></div>

          <form class="login-form" id="signupForm">
            <div class="form-group">
              <label for="signupFullName">Full Name</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                  </svg>
                </span>
                <input type="text" id="signupFullName" name="fullName" placeholder="Enter full name" required autocomplete="name">
              </div>
            </div>

            <div class="form-group">
              <label for="signupEmail">Email</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 8h18a2 2 0 002-2V8a2 2 0 00-2-2H3a2 2 0 00-2 2v6a2 2 0 002 2z" />
                  </svg>
                </span>
                <input type="email" id="signupEmail" name="email" placeholder="Enter email address" required autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <label for="signupUsername">Username</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                </span>
                <input type="text" id="signupUsername" name="signupUsername" placeholder="Choose a username" required autocomplete="username">
              </div>
            </div>

            <div class="form-group">
              <label for="signupPassword">Password</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </span>
                <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" required autocomplete="new-password">
              </div>
            </div>

            <div class="form-group">
              <label for="signupConfirmPassword">Confirm Password</label>
              <div class="login-input-wrapper">
                <span class="login-input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                </span>
                <input type="password" id="signupConfirmPassword" name="signupConfirmPassword" placeholder="Confirm password" required autocomplete="new-password">
              </div>
            </div>

            <button type="submit" class="btn-login">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11a4 4 0 10-4-4 4 4 0 004 4zm0 2c-3.314 0-6 1.79-6 4v1h7m3-5h3m-1.5-1.5V15.5" />
              </svg>
              Sign Up
            </button>
          </form>

          <p class="signup-note">Simulation only &mdash; this will not create an actual account.</p>
        </div>
      </div>

      <div class="login-footer">
        <p>Nursing Informatics School Project</p>
        <p style="margin-top: 4px;">NURplan &copy; 2025</p>
      </div>
    </div>
  </div>

  <script>
    // Login submission (demo only)
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');

    if (loginForm && loginError) {
      loginForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        if (username && password) {
          localStorage.setItem('his_username', username);
          window.location.href = 'dashboard.html';
        } else {
          loginError.textContent = 'Please enter both username and password.';
          loginError.classList.add('visible');
        }
      });

      document.querySelectorAll('#username, #password').forEach(function (input) {
        input.addEventListener('input', function () {
          loginError.classList.remove('visible');
        });
      });
    }

    // Switch between the Login and Signup tabs
    const authTabs = document.querySelectorAll('.auth-tab');
    const authPanels = document.querySelectorAll('.auth-panel');

    authTabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        const targetId = tab.getAttribute('data-target');

        authTabs.forEach(function (t) {
          t.classList.remove('active');
        });
        tab.classList.add('active');

        authPanels.forEach(function (panel) {
          if (panel.id === targetId) {
            panel.classList.add('active');
          } else {
            panel.classList.remove('active');
          }
        });

        // Scroll back to the top after switching tabs
        var panels = document.querySelector('.auth-panels');
        if (panels) panels.scrollTop = 0;
      });
    });

    // Signup simulation (no real account is created)
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');

    if (signupForm && signupMessage) {
      signupForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const fullName = document.getElementById('signupFullName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        const confirmPassword = document.getElementById('signupConfirmPassword').value.trim();

        signupMessage.classList.remove('auth-message--error', 'auth-message--success');

        if (!fullName || !email || !username || !password || !confirmPassword) {
          signupMessage.textContent = 'Please complete all fields.';
          signupMessage.classList.add('auth-message--error');
          return;
        }

        if (password !== confirmPassword) {
          signupMessage.textContent = 'Passwords do not match. Please try again.';
          signupMessage.classList.add('auth-message--error');
          return;
        }

        signupMessage.textContent = 'Account created! (Simulation only)';
        signupMessage.classList.add('auth-message--success');

        signupForm.reset();
      });
    }
  </script>
</body>
</html>
